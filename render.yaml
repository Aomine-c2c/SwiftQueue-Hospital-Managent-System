services:
  # FastAPI Backend Service
  - type: web
    name: swiftqueue-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free  # Change to 'starter' for production (no sleep)
    autoDeploy: true
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: SECRET_KEY
        generateValue: true  # Render will auto-generate a secure value
      - key: DATABASE_URL
        fromDatabase:
          name: swiftqueue-db
          property: connectionString
      - key: PORT
        value: 8000

# PostgreSQL Database (optional - uncomment if you want Render-managed DB)
# databases:
#   - name: swiftqueue-db
#     databaseName: swiftqueue
#     plan: free  # 90-day free trial, then $7/month
#     user: swiftqueue_user
