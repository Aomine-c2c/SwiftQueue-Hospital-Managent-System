apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftqueue-frontend
  labels:
    app: swiftqueue
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiftqueue
      component: frontend
  template:
    metadata:
      labels:
        app: swiftqueue
        component: frontend
    spec:
      containers:
      - name: frontend
        image: swiftqueue/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: swiftqueue-frontend-service
  labels:
    app: swiftqueue
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: swiftqueue
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
