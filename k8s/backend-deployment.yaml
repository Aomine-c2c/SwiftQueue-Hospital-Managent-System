apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftqueue-backend
  labels:
    app: swiftqueue
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swiftqueue
      component: backend
  template:
    metadata:
      labels:
        app: swiftqueue
        component: backend
    spec:
      containers:
      - name: backend
        image: swiftqueue/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: swiftqueue-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: swiftqueue-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: swiftqueue-secrets
              key: secret-key
        - name: PORT
          value: "8000"
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: swiftqueue-secrets
              key: sentry-dsn
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: swiftqueue-backend-service
  labels:
    app: swiftqueue
    component: backend
spec:
  type: ClusterIP
  selector:
    app: swiftqueue
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swiftqueue-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swiftqueue-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
