apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftqueue-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  tls:
  - hosts:
    - swiftqueue.example.com
    secretName: swiftqueue-tls
  rules:
  - host: swiftqueue.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: swiftqueue-backend-service
            port:
              number: 8000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: swiftqueue-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: swiftqueue-frontend-service
            port:
              number: 80
