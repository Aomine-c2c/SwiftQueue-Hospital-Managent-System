apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftqueue-config
data:
  CORS_ORIGINS: "https://swiftqueue.example.com"
  RATE_LIMIT_ENABLED: "true"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: swiftqueue-secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/swiftqueue"
  redis-url: "redis://:password@redis:6379/0"
  secret-key: "change-this-to-a-secure-random-string-in-production"
  sentry-dsn: ""
  jwt-secret: "change-this-jwt-secret-key"
